# 极简流程预设
name: "极简流程"
description: "开发 → 测试，无计划阶段。适合需求已经很明确的小任务"

roles:
  developer:
    description: "编写代码实现功能"
    prompt: "prompts/developer.md"
    model: ""
    paired_with: [tester]
    max_retries: 3
    veto_power: false

  tester:
    description: "验证代码是否满足验收条件"
    prompt: "prompts/tester.md"
    model: ""
    paired_with: []
    max_retries: 0
    veto_power: false

workflow:
  init: []
  per_task:
    - role: developer
    - role: tester
  finalize: []
  task_strategy: serial
  max_parallel: 3         # 并行上限（task_strategy=parallel 时生效，默认3）

# 极简模式说明：任务列表由用户直接在 requirements.md 中列出
# requirements.md 格式示例：
# ---
# tasks:
#   - id: 1
#     name: "任务名"
#     description: "做什么"
#     acceptance_criteria:
#       - "验收条件1"
# ---
