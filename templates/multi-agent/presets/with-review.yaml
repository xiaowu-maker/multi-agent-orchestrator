# 带代码审查的预设
name: "带代码审查"
description: "计划 → 开发 → (测试 + 代码审查)，适合对代码质量要求高的项目"
version: "1.0"

roles:
  planner:
    description: "分析需求，制定开发计划，拆解任务"
    prompt: "~/.claude/templates/multi-agent/prompts/planner.md"
    lifecycle: once
    paired_with: []
    max_retries: 0
    veto_power: false

  developer:
    description: "编写代码实现功能"
    prompt: "~/.claude/templates/multi-agent/prompts/developer.md"
    lifecycle: persistent
    paired_with: [tester, reviewer]
    max_retries: 3
    veto_power: false

  tester:
    description: "验证功能是否满足验收条件"
    prompt: "~/.claude/templates/multi-agent/prompts/tester.md"
    lifecycle: persistent
    paired_with: []
    max_retries: 0
    veto_power: false

  reviewer:
    description: "审查代码质量、可维护性和安全性"
    prompt: "~/.claude/templates/multi-agent/prompts/reviewer.md"
    lifecycle: persistent
    paired_with: []
    max_retries: 0
    veto_power: true

workflow:
  checkpoints:
    - after: init
    - after: all_tasks
    - on: escalation

  init:
    - role: planner
      count: 1

  per_task:
    - role: developer
      count: 1
    - role: tester
      count: 1
    - role: reviewer
      count: 1

  finalize: []

  task_strategy: serial
