# 带代码审查的预设
name: "带代码审查"
description: "计划 → 开发 → (测试 + 代码审查)，适合对代码质量要求高的项目"

roles:
  planner:
    description: "分析需求，制定开发计划，拆解任务"
    prompt: "prompts/planner.md"
    model: ""
    paired_with: []
    max_retries: 0
    veto_power: false

  developer:
    description: "编写代码实现功能"
    prompt: "prompts/developer.md"
    model: ""
    paired_with: [tester, reviewer]
    max_retries: 3
    veto_power: false

  tester:
    description: "验证功能是否满足验收条件"
    prompt: "prompts/tester.md"
    model: ""
    paired_with: []
    max_retries: 0
    veto_power: false

  reviewer:
    description: "审查代码质量、可维护性和安全性"
    prompt: "prompts/reviewer.md"
    model: ""
    paired_with: []
    max_retries: 0
    veto_power: true    # 一票否决：critical 问题未解决时强制 FAILED

workflow:
  init:
    - role: planner
  per_task:
    - role: developer
    - role: tester
    - role: reviewer
  finalize: []
  task_strategy: serial
